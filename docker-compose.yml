version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: amde_postgres_db
    restart: always
    environment:
      - POSTGRES_USER=amde
      - POSTGRES_PASSWORD=amde
      - POSTGRES_DB=amde_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/gestao-clinica/Dockerfile
    container_name: amde_backend
    restart: always
    depends_on:
      - db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/amde_db
      - SPRING_DATASOURCE_USERNAME=amde
      - SPRING_DATASOURCE_PASSWORD=amde
    expose:
      - "8080"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: amde_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data: