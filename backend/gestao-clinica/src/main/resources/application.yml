spring:
  application:
    name: gestao-clinica

  datasource:
    url: jdbc:postgresql://localhost:5432/gestao_clinica
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: none 
    show-sql: true
    properties:
      hibernate.format_sql: true

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml

server:
  port: 8080
