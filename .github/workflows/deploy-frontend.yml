name: Deploy Frontend

# 1. Gatilho Automatico (CI/CD na main)
on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      
  # 2. Gatilho Manual (Para ambientes de teste/Learner Lab)
  workflow_dispatch:
    inputs:
      TARGET_IP:
        description: 'IP Público do EC2 para a API (Opcional. Deixe em branco para Prod)'
        required: false

# Variáveis Padrão (Produção)
env:
  # IP de Produção (Seu IP atual)
  IP_PROD_PADRAO: '54.233.239.101' 
  CLOUDFRONT_DISTRIBUTION_ID: 'E3ERVQZQ0D59RW' # Seu ID CloudFront
  S3_BUCKET_NAME: 'amde-app-frontend-prod'
  AWS_REGION: 'sa-east-1' # Região do seu bucket

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Determinar o IP a ser usado
      - name: Determine Target IP
        id: determine_ip
        run: |
          # Se o IP for fornecido manualmente, usa ele. Senão, usa o padrão de produção.
          INPUT_IP="${{ github.event.inputs.TARGET_IP }}"
          
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "$INPUT_IP" ]; then
            echo "IP_FINAL=$INPUT_IP" >> $GITHUB_ENV
            echo "EXECUTANDO DEPLOY MANUAL (IP: $INPUT_IP)"
          else
            echo "IP_FINAL=${{ env.IP_PROD_PADRAO }}" >> $GITHUB_ENV
            echo "EXECUTANDO DEPLOY AUTOMÁTICO PARA PRODUÇÃO"
          fi

      # 2. Checkout e Setup Node
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Build project
      - name: Build project
        run: npm run build
        working-directory: ./frontend

      # 4. Injetar URL da API (Substituindo o placeholder)
      - name: Inject API URL into Build Output
        run: |
          # Procura o placeholder $$API_IP_ADDRESS$$ e substitui pelo IP final (com a porta 8080)
          find ./frontend/dist -type f -name "*.js" -exec sed -i "s|$$API_IP_ADDRESS$$|http://${{ env.IP_FINAL }}:8080|g" {} \;

      # 5. Configurar Credenciais AWS
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # 6. Deploy Static Files to S3
      - name: Deploy static files to S3
        uses: aws-actions/aws-cli@v2
        with:
          args: >
            s3 sync ./frontend/dist s3://${{ env.S3_BUCKET_NAME }} --delete

      # 7. Invalidar CloudFront (APENAS SE FOR DEPLOY DE PRODUÇÃO)
      - name: Invalidate CloudFront cache
        # Só invalida se o IP usado for o IP de produção padrão.
        if: ${{ env.IP_FINAL == env.IP_PROD_PADRAO }}
        uses: aws-actions/aws-cli@v2
        with:
          args: >
            cloudfront create-invalidation --distribution-id ${{ env.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"