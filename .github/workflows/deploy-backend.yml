name: Deploy Backend to AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Baixar o Código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java (JDK 21)
      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Buildar o Projeto (Maven)
      - name: Build Spring Boot app with Maven
        run: |
          mvn clean package -f backend/gestao-clinica/pom.xml -DskipTests

      # 4. Copiar o .jar para a EC2 (SEM RENOMEAR)
      - name: Copy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "backend/gestao-clinica/target/*.jar"
          target: "/home/ubuntu/amde-backend/"

      # 5. Renomear o .jar E Reiniciar o Serviço
      - name: Rename JAR and Restart Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            cd /home/ubuntu/amde-backend/
            # Renomeia o arquivo que acabou de chegar para 'app.jar'
            mv gestao-clinica-*.jar app.jar
            
            # Agora recarrega e reinicia o serviço
            sudo systemctl daemon-reload
            sudo systemctl restart amde-backend.service
            sudo systemctl status amde-backend.service