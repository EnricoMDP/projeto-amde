name: Deploy Backend to AWS EC2

# Gatilho: Rodar quando houver push na 'main'
# e SOMENTE se houver mudanças na pasta 'backend/'.
on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Baixar o Código
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java (JDK 21)
      # Baseado no seu Dockerfile e pom.xml
      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      # 3. Buildar o Projeto (Maven)
      - name: Build Spring Boot app with Maven
        run: |
          mvn clean package -f backend/gestao-clinica/pom.xml -DskipTests

      # 4. Copiar o .jar para a EC2 (via SCP/SSH)
      - name: Deploy JAR to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          source: "backend/gestao-clinica/target/*.jar"
          target: "/home/ubuntu/amde-backend/"
          rename: "app.jar" # Renomeia o JAR para o nome que o serviço espera

      # 5. Reiniciar o Serviço na EC2
      - name: Restart backend service on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            sudo systemctl restart amde-backend.service
            sudo systemctl status amde-backend.service